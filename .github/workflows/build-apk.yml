name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Verify source formatting and required resources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/res/drawable-nodpi/bg_wallpaper.png
          test -f app/src/main/res/drawable-nodpi/ic_splash.png
          test -f app/src/main/java/com/nexus/ssh/MainActivity.kt
          grep -q 'com.adamglin:phosphor-icon' app/build.gradle.kts
          grep -q 'downloadDesignFonts' app/build.gradle.kts

      - name: Run unit tests, Android lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --no-daemon --stacktrace --warning-mode=all --console=plain 2>&1 | tee build.log

      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-verification-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
            build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed-by-debug-config release APK on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease -x lintVitalRelease --no-daemon --stacktrace --console=plain 2>&1 | tee release-build.log
          cp app/build/outputs/apk/release/app-release.apk nexus-ssh.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-ssh.apk
          generate_release_notes: true
