name: Nexus SSH Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "01 · Test & Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The legacy SDK "tools" package has been removed from Google's repository.
      # Install only platform-tools; Gradle/AGP resolves the required platform and build-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Verify required project resources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/res/drawable-nodpi/bg_wallpaper.png
          test -f app/src/main/res/drawable-nodpi/ic_splash.png
          test -f app/src/main/java/com/nexus/ssh/MainActivity.kt
          grep -q 'com.adamglin:phosphor-icon:1.0.0' app/build.gradle.kts
          grep -q 'import androidx.compose.foundation.layout.height' app/src/main/java/com/nexus/ssh/MainActivity.kt
          grep -q 'import androidx.compose.ui.text.font.FontFamily' app/src/main/java/com/nexus/ssh/ui/Theme.kt
          grep -q 'import com.nexus.ssh.ui.LocalAccent' app/src/main/java/com/nexus/ssh/ui/screens/LogsScreen.kt
          ! grep -R 'PhosphorIcons\\.Regular\\.' app/src/main/java
          grep -q 'downloadDesignFonts' app/build.gradle.kts

      - name: Run unit tests and Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug \
            --no-daemon --stacktrace --warning-mode=all --console=plain 2>&1 | tee verify.log

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-test-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
            verify.log
          retention-days: 14

  build:
    name: "02 · Debug Build"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode=all --console=plain 2>&1 | tee debug-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-debug-build-log
          path: debug-build.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: "03 · Release Build"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode=all --console=plain 2>&1 | tee release-build.log
          cp app/build/outputs/apk/release/app-release.apk "nexus-ssh-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-release-apk
          path: nexus-ssh-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-ssh-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-release-build-log
          path: release-build.log
          if-no-files-found: ignore
          retention-days: 30
